name: Deploy to GitHub Pages

# Build the standalone (backend-free) SPA and publish it to GitHub Pages.
# Enable once: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deploy; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Build (standalone, base path from repo name)
        env:
          VITE_STANDALONE: '1'
          # project pages are served from /<repo>/ ; a <user>.github.io repo is served from /
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            export VITE_BASE=/
          fi
          echo "Building with VITE_BASE=$VITE_BASE"
          npm run build
          # SPA + Pages: 404 falls back to index.html so deep links work
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
